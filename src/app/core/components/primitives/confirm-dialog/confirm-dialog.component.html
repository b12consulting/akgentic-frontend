@if (service.current(); as open) {
  <div
    class="confirm-backdrop"
    data-test="confirm-backdrop"
    (click)="onBackdropClick($event)"
  >
    <div
      #panel
      class="confirm-panel"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="headerId"
      [attr.aria-describedby]="messageId"
      data-test="confirm-dialog"
      (keydown)="onKeydown($event)"
    >
      <h2 class="confirm-panel__header" [id]="headerId">{{ open.request.header }}</h2>
      <p class="confirm-panel__message" [id]="messageId" data-test="confirm-message">
        {{ open.request.message }}
      </p>
      <!--
        Cancel FIRST in the DOM, so it is also first in the Tab order and the
        button focus lands on when the dialog opens.
      -->
      <div class="confirm-panel__actions">
        <button
          #cancelBtn
          type="button"
          class="confirm-btn"
          data-test="confirm-cancel"
          (click)="service.settle(false)"
        >
          {{ open.request.cancelLabel }}
        </button>
        <button
          type="button"
          class="confirm-btn confirm-btn--primary"
          [class.confirm-btn--danger]="open.request.tone === 'danger'"
          data-test="confirm-accept"
          (click)="service.settle(true)"
        >
          {{ open.request.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
