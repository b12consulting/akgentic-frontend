<!-- Context-management markers (Epic 29 / ADR-010): rule 6 = collapsible
     "Summarized N" compaction fold; rule 7 = inert "Conversation cleared" line.
     No sender/recipient, no left/right alignment — not a chat bubble. -->
<div *ngIf="isMarker()" class="system-marker">
  <div
    class="system-marker-line"
    [class.expandable]="message().rule === 6"
    (click)="onToggleMarker()"
  >
    <i class="pi system-marker-icon" [ngClass]="markerIcon()"></i>
    <span class="system-marker-label">{{ message().label }}</span>
    <i
      *ngIf="message().rule === 6"
      class="pi system-marker-caret"
      [ngClass]="message().collapsed ? 'pi-chevron-right' : 'pi-chevron-down'"
    ></i>
    <span class="system-marker-timestamp">{{
      timestampOrNull() | date : "HH:mm"
    }}</span>
  </div>
  <div
    *ngIf="message().rule === 6 && !message().collapsed"
    class="system-marker-summary"
  >
    <markdown [data]="message().content"></markdown>
  </div>
</div>

<!-- Rule 5 — the system announcement, in its TWO shapes.

     Chrome either way: nobody said it, so it gets no avatar, no side and no
     bubble, and it stays inert (every handler returns early on rule 5).

     A CAPTION ("Team started") keeps the centred rule it was designed for — a
     marker in the transcript rather than a participant in it.

     A BODY — a team's welcome message, which a deployment authors as markdown
     and which can run to several paragraphs — cannot use that shape at all:
     a flex row collapses its newlines, the caption's `nowrap` refuses to wrap,
     and an interpolated span shows its markdown as source. It gets the block
     below, through the same `ngx-markdown` path an ordinary turn uses. See
     `isSystemCaption` for where the line is drawn and why. -->
<div
  *ngIf="message().rule === 5 && isSystemCaption()"
  class="system-rule"
  role="separator"
>
  <span class="system-rule-line"></span>
  <span class="system-rule-label">{{ message().content }}</span>
  <span class="system-rule-line"></span>
</div>

<!-- The same announcement when it has a body. Styled from the marker idiom
     (rule 6/7) rather than from the turn bubble, because that is what it is:
     the transcript's own chrome, not somebody's message. -->
<div *ngIf="message().rule === 5 && !isSystemCaption()" class="system-announcement">
  <div class="markdown-content">
    <markdown [data]="message().content"></markdown>
  </div>
</div>

<!-- The bubble: your message (rule 1) or an agent's answer to you (rule 2). -->
<div
  *ngIf="message().rule === 1 || message().rule === 2"
  class="message"
  [class.right]="message().alignment === 'right'"
  [class.left]="message().alignment === 'left'"
>
  <!-- The speaker's mark, on their side only. The user's own turn is already
       identified by being a bubble on the right, so a second marker there would
       label what the shape has already said. -->
  <!--
    Filled with the SPEAKER'S OWN colour when there is one — the same colour
    their node wears on the hierarchy graph and their tile wears in the member
    list, which is the whole point of there being one. Falls back to the flat
    worker fill in the stylesheet when the lookup withholds a colour (a tool, or
    a roster that has not arrived), so the mark is never blank.
  -->
  <span
    class="turn-avatar"
    *ngIf="message().alignment === 'left' && message().rule !== 5"
    [style.background-color]="senderColour()"
    [class.tinted]="senderColour() !== null"
    aria-hidden="true"
    >{{ avatarInitial() }}</span
  >
  <div
    class="message-bubble"
    [class.own-turn]="message().rule === 1"
    [style.background-color]="message().color"
  >
    <!--
      NO HEADER ON THE USER'S OWN TURN (rule 1).

      The header's only other child, the name pill, is about the speaker, so on
      a user's turn the header would render as a bare clock above their words.
      The mock draws that bubble as text and nothing else, and it is right to:
      you do not need to be told what time you typed something, and the stamp
      was the only thing standing between the bubble's top edge and the message.
    -->
    <div class="bubble-header" *ngIf="message().rule !== 1">
      <!-- The speaker's name, as plain text: it opens nothing. -->
      <span
        *ngIf="showAgentNames"
        class="label-pill"
        [class.tinted]="senderColour() !== null"
        [style.--akg-party-colour]="senderColour()"
      >
        {{ message().label }}
      </span>
      <span class="bubble-timestamp">{{
        timestampOrNull() | date : "HH:mm"
      }}</span>
    </div>
    <!--
      A PERSON'S OWN TYPING IS NOT MARKDOWN.

      Rule 1 is what the user typed into the composer, and running it through
      the markdown pipeline silently reformats it: a line starting `#` becomes a
      heading, `*` becomes a bullet, `_word_` loses its underscores, and a
      pasted code fragment can vanish entirely. None of that was asked for, and
      the user has no way to escape it. `pre-wrap` renders it back exactly as it
      was written, newlines included — which is also what the mock draws.

      Everything else on this surface IS authored as markdown by an agent, and
      keeps the pipeline.
    -->
    <div class="markdown-content" *ngIf="message().rule === 1; else renderedBody">
      <div class="own-text">{{ message().content }}</div>
      <!--
        THE CLOCK, AFTER THE WORDS RATHER THAN ABOVE THEM.

        Rule 1 has no `.bubble-header` — see above — and the reason still
        holds: every other child of that row is gated to a rule that is not 1,
        so on the user's own turn it rendered as a bare clock sitting between
        the bubble's top edge and their message.

        What did not hold is dropping the stamp with it. Every other row in the
        transcript carries one — the agent's turn, the folded notice, the
        activity fold — so the user's own message was the single item in the
        sequence with no time on it, which is the same defect the activity
        fold's own clock exists to avoid.

        At the END of the message and inside the bubble, so it is a footnote to
        what was said rather than a heading over it: it takes width the last
        line was not using and costs the turn no height. A step smaller than
        the stamp in an agent's header, because that one shares a row with the
        speaker's name while this one sits inside the sentence.
      -->
      <!--
        WHERE IT WENT, when that is not the obvious answer.

        Two identical "Hello" bubbles that went to two different agents were
        indistinguishable, and the only cue available — the name on the reply
        below — is wrong the moment the agent you addressed delegates.

        `ownRecipient()` is null on an ordinary turn, so this is silent on the
        messages where the user chose nobody: a caption on every turn is a
        caption nobody reads by the fourth one.

        The arrow is for the eye and is `aria-hidden`; the accessible name
        carries the same fact in words, because "right-arrow at Expert" is not
        a sentence.
      -->
      <span
        *ngIf="ownRecipient() as recipient"
        class="own-recipient"
        [attr.aria-label]="'chat.sentTo' | translate : { agent: recipient }"
        ><span aria-hidden="true">→ </span>{{ recipient }}</span
      >
      <span class="own-timestamp">{{
        timestampOrNull() | date : "HH:mm"
      }}</span>
    </div>
    <ng-template #renderedBody>
      <div class="markdown-content">
        <markdown [data]="message().content"></markdown>
      </div>
    </ng-template>
    <!-- Epic 57: the rating control, on the turns the rule allows and no
         others. `rateable()` delegates to the single predicate — the answer is
         NOT restated here, so a message kind added later cannot become
         rateable by a template nobody reread. -->
    <app-feedback
      *ngIf="rateable() && ratingEnabled()"
      class="turn-feedback"
      [message]="message()"
    ></app-feedback>
  </div>
</div>
