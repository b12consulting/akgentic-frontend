<!--
  Monogram, name over role, status dot — ONE control with one destination.

  THE CARD OPENS THIS MEMBER IN THE INSPECTOR'S MEMBER TAB. The whole card is
  the button, so the target is the row you scan rather than a 14px glyph beside
  it, and a keyboard user reaches it with one Tab and opens it with Enter or
  Space, as with any native button.

  `[style.--akg-depth]` publishes THE DEPTH, not the offset. The row says how
  many steps in it is and the stylesheet decides how wide a step is
  (`--akg-member-indent`), so the size of the indent has exactly one owner.
  Binding the computed pixels here is what made that token dead: a deployment
  could re-point it and this card would go on multiplying by a TypeScript
  constant. A custom property rather than a class-per-depth ladder because the
  depth is runtime data, and a ladder would restate the cap in the stylesheet
  too.

  `.working` carries the slow pulse that marks the agent currently running —
  see the stylesheet. On the CARD rather than on the status dot: the card is
  what you scan, and a 6px dot changing opacity is not something the eye
  catches in a list of ten.
-->
<button
  type="button"
  class="member-card"
  [class.supervisor]="member.kind === 'supervisor'"
  [class.worker]="member.kind === 'worker'"
  [class.working]="member.active"
  [style.--akg-depth]="member.depth"
  [attr.aria-label]="'inspector.openMemberDetails' | translate : { agent: member.label }"
  (click)="onSelect()"
>
  <!-- Decorative: the name beside it is what a screen reader should read, and
       an initial announced on its own is a letter with no meaning. -->
  <!--
    Filled with the MEMBER'S OWN colour when the roster gave it one — the same
    colour their node wears on the hierarchy graph and their speaker mark
    wears in the transcript. Bound inline because it is data, one stop out of
    a ten-stop ramp, which a stylesheet cannot enumerate; `.tinted` is what
    fixes the ink that has to sit on top of it. A member with no colour keeps
    the flat worker fill, so the tile is never blank.
  -->
  <span
    class="member-avatar"
    [class.tinted]="member.colour !== null"
    [style.background-color]="member.colour"
    aria-hidden="true"
    >{{ member.initial }}</span
  >

  <span class="member-body">
    <span class="member-name">{{ member.label }}</span>
    <span class="member-role">{{ member.roleKey | translate }}</span>
  </span>

  <span
    class="member-dot"
    [class.idle]="!member.active"
    [attr.title]="
      (member.active ? 'inspector.memberActive' : 'inspector.memberIdle')
        | translate
    "
  ></span>
</button>
