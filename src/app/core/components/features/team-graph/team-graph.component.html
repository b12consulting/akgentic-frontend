<div class="graph-component-container">
  <!--
    The height comes from the PANE, not from the window.

    `calc(100vh - 260px)` was written when this graph owned the page: 260px was
    the chrome above it in that layout. Inside the 310px inspector the panel box
    already has a height (the Epic-56 flex chain, stated end to end in
    `process.component.scss`), and a viewport-derived one is simply a different,
    larger number — so the canvas ran past the bottom of its own panel and
    echarts sized its layout to a box nobody could see the end of.

    In the stylesheet rather than an inline `style`, so it is one rule that can
    be reasoned about rather than a literal the DOM inspector shows winning
    against everything.
  -->
  <div
    echarts
    class="graph-container"
    [options]="graphOptions"
    (chartInit)="onChartInit($event)"
  ></div>

  <!--
    AN EMPTY GRAPH LOOKS EXACTLY LIKE A BROKEN ONE. A canvas with nothing drawn
    on it says nothing at all, and this pane is now the whole hierarchy tab —
    before W6 the list view beside it at least rendered a visible "no rows".

    Overlaid rather than swapped in: the canvas must stay mounted and keep its
    box, because echarts measures its container once at init and a container
    that was `*ngIf`-ed away has no size to measure when the first node lands.

    `pointer-events: none` in the stylesheet, so the message never eats a drag
    on the graph underneath it during the frame where both are on screen.
  -->
  @if (nodes.length === 0) {
    <div class="graph-empty" aria-live="polite">
      <app-empty-state titleKey="panels.noAgentsTitle" />
    </div>
  }

  <app-pending-request [nodes]="nodes"></app-pending-request>
</div>
