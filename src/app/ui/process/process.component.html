<!--
  The console's two right-hand panes. The rail is the shell's, not this view's —
  see `console-shell.component.ts` for why the three panes the design draws as
  siblings cannot be siblings here.

  `#paneTrack` is what the divider measures against, passed in rather than
  discovered: a divider that reached for `parentElement` would silently start
  measuring the wrong box the day someone wrapped either pane.

  THE SWAP IS CSS `order`, NOT A REORDERED TEMPLATE (R3). The DOM order is
  fixed — conversation, divider, inspector — and `.console-panes--swapped`
  moves them visually. Two reasons, both hard. The inspector cannot move out of
  this template at all (it and the five projected panels resolve four
  component-scoped providers off this component's `providers`), and
  `process.component.spec.ts` pins DIRECT-child selectors, so a wrapper or a
  structural swap would break the containment contract that keeps the panes
  where the injector needs them. Reading order stays conversation-first for a
  screen reader either way, which is the right reading order regardless of which
  side the pane is painted on.
-->
<div
  #paneTrack
  class="console-panes"
  [class.console-panes--swapped]="inspectorSide() === 'left'"
>
  <div class="conversation-pane">
    <app-conversation-header></app-conversation-header>
    <app-chat-panel class="chat-app" [processId]="processId"></app-chat-panel>
  </div>

  <!--
    A SIBLING of the two panes, never a wrapper around either.

    `[percent]` / `[min]` / `[max]` are all in the DIVIDER's frame — the
    leftmost pane's share — while everything stored and reasoned about is the
    INSPECTOR's share. The conversion happens here and only here; see
    `pane-layout.ts` for why persisting the divider's own number instead would
    make a swap jump.

    It is GONE while the inspector is collapsed, not merely disabled: with the
    pane pinned at zero a drag moves nothing on screen and still rewrites the
    stored width, so the user would find the pane at a size they never chose the
    next time they opened it.
  -->
  <app-split-divider
    *ngIf="!inspectorCollapsed()"
    [track]="paneTrack"
    [percent]="leadingPercent()"
    [min]="leadingBounds().min"
    [max]="leadingBounds().max"
    [defaultPercent]="leadingDefaultPercent()"
    [label]="'console.splitLabel' | translate"
    (percentChange)="onPanePercent($event)"
    (commit)="onPaneCommit($event)"
  ></app-split-divider>

  <app-console-inspector
    [class.animated]="animateRightColumn"
    [class.resizing]="paneResizing"
    [style.--akg-inspector-basis]="inspectorBasis()"
    [side]="inspectorSide()"
    (swapSides)="onSwapPanes()"
    [options]="(visualizationOptions$ | async) ?? []"
    [mode]="currentVisualizationMode"
    (modeChange)="setVisualizationMode($event)"
  >
    <!--
      The panels are PROJECTED rather than declared inside the inspector: each
      one reads a service that is component-scoped on this component's
      `providers`, and an element declared in the inspector's own template would
      resolve against the inspector's injector and throw.

      One wrapper around the set, and not five loose children, because the rules
      that stack them (below, in this component's stylesheet) have to be able to
      name their parent — and the inspector's own `.inspector__body` carries the
      inspector's style-encapsulation attribute, which nothing written here can
      match.
    -->
    <div class="inspector-panels">
      <!--
        `.moved-offscreen`, NOT `*ngIf`. All five panels stay mounted and the
        inactive ones are pushed out of view. Swapping to a structural gate
        would remount `app-graph` (echarts) and `app-knowledge-graph` on every
        tab change; their init/dispose paths have never been exercised that way,
        and keeping them mounted is why switching tabs is instant and why the
        graph does not re-run its layout each time.

        `inert` is the accessibility half of the same idea: off-screen is not
        hidden, so without it a keyboard user would tab into four panels they
        cannot see, and a screen reader would be told there are five open
        tabpanels. `pointer-events: none` in the stylesheet only covers the
        mouse.
      -->
      <!--
        H2, resolved. The Team tab shows the redesign's roster/tools/spend
        panel; the tree + graph it does NOT carry moved to their own
        `hierarchy` tab below rather than being buried under Member. Both are
        projected, and both stay mounted.

        `(memberSelected)` is the loop the mock leaves open: the panel's cards
        are the obvious way into the Member tab and the prototype leaves them
        inert. The host resolves the agent_id and switches tabs — see
        `onMemberSelected`.
      -->
      <div
        id="inspector-panel-team"
        role="tabpanel"
        aria-labelledby="inspector-tab-team"
        [attr.inert]="isHidden('team') ? '' : null"
        [class.moved-offscreen]="isHidden('team')"
      >
        <app-inspector-team-panel
          (memberSelected)="onMemberSelected($event)"
        ></app-inspector-team-panel>
      </div>

      <div
        id="inspector-panel-hierarchy"
        role="tabpanel"
        aria-labelledby="inspector-tab-hierarchy"
        [attr.inert]="isHidden('hierarchy') ? '' : null"
        [class.moved-offscreen]="isHidden('hierarchy')"
      >
        <app-team-tabs></app-team-tabs>
      </div>

      <div
        id="inspector-panel-member"
        role="tabpanel"
        aria-labelledby="inspector-tab-member"
        [attr.inert]="isHidden('member') ? '' : null"
        [class.moved-offscreen]="isHidden('member')"
      >
        <app-agent-tabs></app-agent-tabs>
      </div>

      <app-workspace-tabs
        *ngIf="hasWorkspace$ | async"
        id="inspector-panel-workspace"
        role="tabpanel"
        aria-labelledby="inspector-tab-workspace"
        [attr.inert]="isHidden('workspace') ? '' : null"
        [class.moved-offscreen]="isHidden('workspace')"
      ></app-workspace-tabs>

      <!--
        `[teamId]` is BOUND, and there is no longer any fallback for it to beat:
        the child's `route.snapshot.params['id']` read is gone and the input is
        `required`, so omitting this binding is a build failure rather than a
        silent `undefined`.

        The fact Story 52-1 recorded still holds and is why binding it is
        correct: hosted on the teams list there is no `:id` in the URL at all,
        so the URL was never a source this host could rely on.
      -->
      <app-knowledge-graph
        *ngIf="hasKnowledgeGraph$ | async"
        id="inspector-panel-knowledge-graph"
        role="tabpanel"
        aria-labelledby="inspector-tab-knowledge-graph"
        [teamId]="processId"
        [attr.inert]="isHidden('knowledge-graph') ? '' : null"
        [class.moved-offscreen]="isHidden('knowledge-graph')"
      ></app-knowledge-graph>

      <app-message-list
        id="inspector-panel-messages"
        role="tabpanel"
        aria-labelledby="inspector-tab-messages"
        [attr.inert]="isHidden('messages') ? '' : null"
        [class.moved-offscreen]="isHidden('messages')"
      ></app-message-list>
    </div>
  </app-console-inspector>
</div>
