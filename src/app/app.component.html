<main>
  <p-menubar
    [model]="items"
    *ngIf="(authService.currentUser$ | async) ?? hideLogin"
  >
    <ng-template #start>
      <div class="header-start">
        <img
          [src]="logo"
          class="logo clickable-logo"
          style="height: 40px; cursor: pointer"
          alt="Logo"
          (click)="navigateToHome()"
          title="Go to Home"
        />
        <div>
          <ng-container
            *ngIf="(contextService.currentTeam$ | async) as team"
          >
            <span class="process-type"
              >{{ team.name }}
              <span class="process-config-name"> — {{ team.config_name }}</span>
              <p-tag
                *ngIf="(contextService.currentTeamRunning$ | async) === false"
                value="Stopped"
                severity="info"
                [style]="{ 'margin-left': '8px' }"
              >
              </p-tag>
              <p-tag
                *ngIf="(contextService.currentTeamRunning$ | async)"
                value="Running"
                severity="success"
                [style]="{ 'margin-left': '8px' }"
              >
              </p-tag>
            </span>
          </ng-container>
        </div>
      </div>
    </ng-template>
    <ng-template #item let-item>
      <ng-container>
        <a [routerLink]="item.route" class="p-menubar-item-link">
          <span [class]="item.icon"></span>
          <span class="mr-2">{{ item.label }}</span>
          <!--
            Story 36-9 — the caller's role, stated once, on the entry that names
            them. `username-menu` is the marker the username entry already
            carries, so no second one is invented for this.

            Its truth is `AuthService.isAdmin$` through the `async` pipe — THE
            one `isAdmin` predicate (ADR-028). A second definition here would be
            a second answer to "is this caller an admin", and the two would
            eventually disagree. The pipe is also what makes the tag appear when
            a late `/auth/me` resolves, without a remount.
          -->
          <p-tag
            *ngIf="
              item.styleClass === 'username-menu' &&
              (authService.isAdmin$ | async)
            "
            value="admin"
            severity="secondary"
            data-test="menubar-admin-tag"
            [style]="{ 'margin-left': '8px' }"
          ></p-tag>
        </a>
      </ng-container>
    </ng-template>
  </p-menubar>
  <section class="content">
    <router-outlet></router-outlet>
  </section>
  <p-toast (onClose)="onToastClose($event)"></p-toast>
</main>
