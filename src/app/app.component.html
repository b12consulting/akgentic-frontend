<main>
  <p-menubar
    [model]="items"
    *ngIf="(authService.currentUser$ | async) ?? hideLogin"
  >
    <ng-template #start>
      <div class="header-start">
        <img
          [src]="logo"
          class="logo clickable-logo"
          style="height: 40px; cursor: pointer"
          [alt]="'chrome.logoAlt' | translate"
          (click)="navigateToHome()"
          [title]="'chrome.goHome' | translate"
        />
        <div>
          <ng-container
            *ngIf="(contextService.currentTeam$ | async) as team"
          >
            <span class="process-type"
              >{{ team.name }}
              <!--
                The team's business metadata, between the name and the status
                chip. Renders nothing at all when the team carries none — the
                pipe yields `[]` for both wire spellings of "no metadata"
                (absent key, explicit null), so no empty container and no
                placeholder is emitted.

                Through the PIPE, never a bare `metadataEntries(team)` call: a
                function in a binding re-runs every change-detection cycle and
                returns new object identities, which makes `NgForOf` rebuild
                every chip each tick. See TeamMetadataPipe.
              -->
              <span
                *ngFor="
                  let entry of team.metadata | teamMetadata;
                  trackBy: trackMetadataEntry
                "
                class="process-metadata"
                [attr.data-test]="'header-metadata-' + entry.key"
                ><span class="process-metadata__label">{{ entry.label }}</span
                >{{ entry.value }}</span
              >
              <p-tag
                *ngIf="(contextService.currentTeamRunning$ | async) === false"
                [value]="'team.status.stopped' | translate"
                severity="info"
                [style]="{ 'margin-left': '8px' }"
              >
              </p-tag>
              <p-tag
                *ngIf="(contextService.currentTeamRunning$ | async)"
                [value]="'team.status.running' | translate"
                severity="success"
                [style]="{ 'margin-left': '8px' }"
              >
              </p-tag>
            </span>
          </ng-container>
        </div>
      </div>
    </ng-template>
    <ng-template #item let-item>
      <ng-container>
        <a [routerLink]="item.route" class="p-menubar-item-link">
          <span [class]="item.icon"></span>
          <span class="mr-2">{{ item.label }}</span>
        </a>
      </ng-container>
    </ng-template>
  </p-menubar>
  <section class="content">
    <router-outlet></router-outlet>
  </section>
  <p-toast (onClose)="onToastClose($event)"></p-toast>
</main>
