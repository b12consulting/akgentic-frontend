<!--
  The chrome rule lives in `chromeVisible$`, not in this binding. It used to be
  `!!(user) || hideLogin` — an expression that can never be false in the running
  app, because `AuthService` answers "signed out" with an anonymous user object
  rather than with `null`. The route is what decides it now; see the field.

  `?? false` because `strictTemplates` types `| async` as `T | null`, and the
  shell's input is `boolean`. `false` is also the shell's own documented
  fail-safe: a missing rail is a missing affordance, a rail on the login screen
  is a leak.

  The router outlet is PROJECTED into the shell rather than placed beside it, so
  the routed view inherits the shell's height chain. Both scroll regions on
  `/process/:id` measure off it.
-->
<app-console-shell [chromeVisible]="(chromeVisible$ | async) ?? false">
  <router-outlet></router-outlet>
</app-console-shell>

<!--
  Outside the shell on purpose: a viewport-positioned overlay clipped by the
  shell's `overflow: hidden` would simply never appear. Exactly one mount, with
  no `key` — see `NotificationToastService` and story 31-5.
-->
<p-toast (onClose)="onToastClose($event)"></p-toast>

<!--
  THE TEAM-CREATION WIZARD. Outside the shell for the toast's reason, and mounted
  here rather than in the rail for a second one: the control that opens it lives
  in the rail, and a collapsed rail is `inert` + `aria-hidden`, so a dialog
  nested there would stop accepting input the moment the rail closed behind it.

  `@if`, not `[visible]` on a permanently-instantiated component, and that is the
  load-bearing part. The wizard provides `TeamCreationService` on itself, and
  that service's captured namespace and open dialog are documented to die with
  their host. The gate only keeps that promise if the host is destroyed — which
  is what this gate does and what a hidden-but-alive component would not.

  Nothing but the boolean crosses this line: the flag comes from
  `TeamCreationLauncher`, and where a created team lands is the dialog's own
  decision, not the root's.
-->
@if (creationLauncher.isOpen()) {
  <app-team-creation-dialog />
}
