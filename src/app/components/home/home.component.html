<section class="content">
  <br />
  <div class="main-container">
    <!--
      Controls row (dropdown + Create/Configuration/Refresh + "Show all" toggle).
      Wrapped so it stays a normal-flow block (its master inline layout) and is
      NOT a stretched/stacked flex child of .main-container — the table area
      below is the only flex/scroll region (Story 28.3).
    -->
    <div class="home-controls">
    <!--
      The team-TYPE select. It decides which team a Create makes AND which
      metadata fields the filter bar below offers — it does NOT narrow the
      list. The narrowing control is the toggle in the filter row; labelled
      badly, this select reads as a filter that does not work (Epic 48 AC14).
    -->
    <span class="home-controls__group">
    <label for="namespace-select" class="home-controls__label">Team type</label>
    <p-select
      size="small"
      inputId="namespace-select"
      [options]="(namespaces$ | async) || []"
      [ngModel]="selectedNamespace$ | async"
      (ngModelChange)="onNamespaceSelected($event)"
      optionLabel="name"
      placeholder="Select a team type"
    >
      <ng-template let-ns pTemplate="item">
        <div [attr.title]="ns.description">{{ ns.name }}</div>
      </ng-template>
      <ng-template let-ns pTemplate="selectedItem">
        <div [attr.title]="ns.description">{{ ns.name }}</div>
      </ng-template>
    </p-select>
    </span>
    <!--
      Admin-only "show all namespaces" toggle (ADR-028). Admin-gated UX
      affordance only; NOT the security boundary (the infra unscoping of admin
      reads is authoritative). `*ngIf="(isAdmin$ | async)"` so non-admins (incl.
      anonymous, no roles) never see it — hidden, not merely disabled. Default
      off (firehose is opt-in). Flips `showAllNamespaces` via `onToggleShowAll`,
      which re-runs the single `loadNamespaces()` path so `?all=true` flows
      through it.
    -->
    <span
      *ngIf="(isAdmin$ | async)"
      class="show-all-namespaces"
    >
      <p-toggleswitch
        [ngModel]="showAllNamespaces"
        (ngModelChange)="onToggleShowAll($event)"
        data-test="show-all-namespaces-toggle"
        inputId="show-all-namespaces-toggle"
      ></p-toggleswitch>
      <label for="show-all-namespaces-toggle">Show all namespaces</label>
    </span>
    <button
      pButton
      size="small"
      type="button"
      label="Create"
      [icon]="creation.creatingByGesture ? 'pi pi-spinner pi-spin' : 'pi pi-plus'"
      [disabled]="creation.creatingByGesture || ((namespaces$ | async) || []).length === 0"
      (click)="createTeam()"
      class="extra-small-button"
    ></button>
    <!-- Edit Configuration button; opens the Monaco panel in a dialog. -->
    <button
      pButton
      size="small"
      type="button"
      label="Configuration"
      icon="pi pi-pencil"
      [disabled]="!(selectedNamespace$ | async)"
      (click)="namespacePanelVisible = true"
      class="extra-small-button"
      data-test="edit-namespace-yaml-btn"
    ></button>
    <button
      pButton
      size="small"
      type="button"
      label="Refresh"
      [icon]="isRefreshing ? 'pi pi-spinner pi-spin' : 'pi pi-refresh'"
      [disabled]="isRefreshing"
      (click)="refreshContext()"
      class="extra-small-button"
    ></button>
    <!--
      Show/hide the filter row. Presentation only — it never clears the filter,
      so a HIDDEN row can still be narrowing the list. `hasActiveFilter` is what
      stops that being a lie: while the row is hidden AND filtering, the control
      changes severity and says so in its title, because otherwise the table is
      filtered with its cause off screen and nothing on the page explains it.
    -->
    <button
      pButton
      size="small"
      type="button"
      [label]="filtersVisible ? 'Hide filters' : 'Filters'"
      [icon]="filtersVisible ? 'pi pi-filter-slash' : 'pi pi-filter'"
      [severity]="!filtersVisible && hasActiveFilter ? 'warn' : 'secondary'"
      [attr.aria-expanded]="filtersVisible"
      aria-controls="home-filter-row"
      [attr.title]="
        !filtersVisible && hasActiveFilter
          ? 'A filter is active — the list is narrowed. Show the filters to see or clear it.'
          : (filtersVisible ? 'Hide the filter row' : 'Show the filter row')
      "
      (click)="toggleFilters()"
      class="extra-small-button"
      data-test="toggle-filters-btn"
    ></button>
    </div>

    <!--
      The filter form. Everything it owns — which fields are offered, what is
      typed into them, the narrowing toggle, Reset — lives inside it; this page
      supplies the team type and receives the composed filter back.
    -->
    <app-team-filter
      [namespace]="(selectedNamespace$ | async) ?? null"
      [value]="restoredFilter"
      [visible]="filtersVisible"
      (changed)="onFilterChanged($event)"
    />

    <!--
      Table area — the single flex/scroll region (Story 28.3). Grows to fill the
      bounded .main-container so the [scrollable] table's body scrolls within it
      and the bottom paginator pins; the controls above stay in normal flow.
    -->
    <div class="home-table">
    <!--
      The teams table. Everything a ROW is — its six columns, its action
      controls, their in-flight spinners and the inline description editor —
      lives inside it. This page supplies the page of teams and the paging
      state, and receives back what the user did to a row; the service calls
      that answer those requests stay here.
    -->
    <app-team-table
      [loading]="(contextService.loading$ | async) ?? false"
      [teams]="(contextService.teams$ | async) || []"
      [totalRecords]="contextService.totalCount"
      [rows]="rows"
      [first]="first"
      (lazyLoad)="loadPage($event)"
      (rowSelected)="onRowSelect($event)"
      (stopRequested)="onStopRequested($event)"
      (restoreRequested)="onRestoreRequested($event)"
      (deleteRequested)="deleteTeam($event)"
      (descriptionSaved)="onDescriptionSaved($event)"
    />
    </div>
  </div>
</section>

<!--
  Namespace Panel dialog wrapper.

  `@defer (when namespacePanelVisible)` fetches the NamespacePanelComponent
  (and its Monaco-editor chunk) only on first open. The initial home-page
  bundle stays Monaco-free.

  [(visible)] is split into [visible] + (visibleChange) so the dirty-close
  guard can intercept dismissals; the dirty-close prompt is rendered by the
  panel's own confirm modal via `panel.confirmDiscard()` (ADR-018).

  The header is a <ng-template pTemplate="header"> block so it can render the
  namespace name AND the conditional dirty indicator in the same header.

  [closable] / [dismissableMask] lock the X / dismissable-mask dismissal
  channels during an in-flight write (saving OR cloning). Reads (validate /
  load) stay dismissable — `isWriteInFlight` intentionally excludes
  `validating` / `loading`.

  `[closeOnEscape]="false"` on ALL THREE dialogs (this config host + the
  panel's Clone + confirm modals). PrimeNG attaches `closeOnEscape` as a
  DOCUMENT-level listener per dialog, so a secondary modal's stopPropagation
  cannot stop this host's listener. Instead the host owns ONE coordinated
  Escape handler (`onConfigDialogEscape`, a `document:keydown.escape`
  HostListener) that closes only the topmost secondary modal, or — when none
  is open — runs the config panel close flow.
-->
<p-dialog
  [visible]="namespacePanelVisible"
  (visibleChange)="onNamespacePanelVisibleChange($event)"
  [modal]="true"
  [style]="{ width: '90vw', height: '90vh' }"
  [closable]="!isWriteInFlight"
  [closeOnEscape]="false"
  [dismissableMask]="!isWriteInFlight"
>
  <ng-template pTemplate="header">
    <span class="p-dialog-title">
      {{ namespaceLabel }}
      <span
        *ngIf="namespacePanel?.hasUnsavedChanges() === true"
        class="namespace-panel__dirty-indicator"
        aria-label="Unsaved changes"
        data-test="dirty-indicator-dialog"
      >●</span>
    </span>
  </ng-template>
  @defer (when namespacePanelVisible) {
    <app-namespace-panel
      [namespace]="((selectedNamespace$ | async)?.namespace) ?? ''"
      [existingNamespaces]="namespaceIdentifiers"
      [showAll]="showAllNamespaces"
      (closed)="namespacePanelVisible = false"
      (saved)="onNamespaceSaved()"
    />
  }
</p-dialog>

<!--
  Team-metadata dialog. Opened by the creation gate, whichever path asked it —
  the Create button or the gesture-less hideHome route. The GATE owns
  visibility, the captured namespace and the error state, so all five bindings
  below are one-way in off `creation` and the two outputs carry the decision
  straight back to it. This page renders the element and owns none of it.

  `(confirmed)` binds a promise-returning method to a `void` output. That is
  fine in a template and its result is ignored; wrapping it or adding a
  page-side forwarder would put a creation member straight back on the page.

  NOT deferred: this component is small and pulls in no heavy chunk. The
  @defer block above exists for the namespace panel's Monaco dependency.

  No extra Escape wiring either — `onConfigDialogEscape` is inactive unless the
  namespace panel is open, so PrimeNG's own `closeOnEscape` handles this dialog
  and the resulting `(visibleChange)` routes to cancel like every other
  dismissal channel.
-->
<app-team-metadata-modal
  [visible]="creation.modalVisible"
  [contract]="creation.contract"
  [namespaceLabel]="creation.namespaceLabel"
  [errorMessage]="creation.errorMessage"
  [pending]="creation.submitting"
  (confirmed)="creation.confirm($event)"
  (cancelled)="creation.cancel()"
/>
