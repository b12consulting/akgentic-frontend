<section class="content">
  <!--
    The greeting HEADER. A preceding SIBLING of `.main-container`, never a
    wrapper around it: the table's bounded scroll region is the
    `.content > .main-container` chain, and a div inserted between the two
    would break both the CSS (`min-height: 0` has to reach the card) and the
    spec that pins the direct-child relationship.

    It belongs to THIS page, not to the shell. Mounted in `console-shell` it
    would reappear over every conversation, and a greeting you are shown on
    your way back from somewhere is a banner.
  -->
  <app-home-greeting />

  <!--
    Two children now — the greeting above and this. The split row and list
    wrapper that used to sit here are gone with Epic 52: opening a team is a
    navigation to `/process/:id` again, so there is no second pane for this
    page to make room for and no divider between them. `.main-container` bounds
    the table's scroll region straight off `.content`.
  -->
  <div class="main-container">
    <!--
      Controls row (team-type select + Configuration/Refresh/Filters + the
      admin "Show all" toggle). Create is NOT among them any more — see below.
      Wrapped so it stays a normal-flow block (its master inline layout) and is
      NOT a stretched/stacked flex child of .main-container — the table area
      below is the only flex/scroll region (Story 28.3).
    -->
    <div class="home-controls">
    <!--
      The way back to the rail, and the ONLY one on this page: the brand row's
      collapse control lives in the rail itself, so with the rail collapsed
      there would otherwise be no control anywhere that could bring it back.
      Rendered only while it is collapsed — a permanent "show sidebar" beside a
      visible sidebar is furniture.
    -->
    @if (viewService.isRailCollapsed$ | async) {
      <app-icon-button
        [label]="'chrome.showSidebar' | translate"
        (pressed)="viewService.toggleRail()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M9 4v16" />
        </svg>
      </app-icon-button>
    }
    <!--
      The team-TYPE select. It decides which team a Create makes AND which
      metadata fields the filter bar below offers — it does NOT narrow the
      list. The narrowing control is the toggle in the filter row; labelled
      badly, this select reads as a filter that does not work (Epic 48 AC14).

      Sectioned into "Teams" (namespaces that declare a team) and "Library"
      (everything else), each alphabetical. `[options]` binds the SECTIONED
      projection `namespaceGroups$`; every other consumer on this page still
      reads the flat `namespaces$`, which carries the same order.
    -->
    <span class="home-controls__group">
    <label for="namespace-select" class="home-controls__label">{{ "home.teamType" | translate }}</label>
    <!--
      `panelStyleClass` is how the OVERLAY gets restyled at all. PrimeNG
      teleports the panel to the body's overlay container, so it leaves this
      component's view and no `:host ::ng-deep` rule can reach it — including
      the Teams / Library section headers, which live only there. The class
      names the rules in this component's stylesheet that are emitted unscoped
      for exactly that reason.
    -->
    <p-select
      size="small"
      inputId="namespace-select"
      panelStyleClass="home-teamtype-panel"
      [options]="(namespaceGroups$ | async) || []"
      [group]="true"
      optionGroupLabel="label"
      optionGroupChildren="items"
      [ngModel]="selectedNamespace$ | async"
      (ngModelChange)="onNamespaceSelected($event)"
      optionLabel="name"
      [placeholder]="'home.teamTypePlaceholder' | translate"
    >
      <ng-template let-ns pTemplate="item">
        <div [attr.title]="ns.description">{{ ns.name }}</div>
      </ng-template>
      <ng-template let-ns pTemplate="selectedItem">
        <div [attr.title]="ns.description">{{ ns.name }}</div>
      </ng-template>
    </p-select>
    </span>
    <!--
      Admin-only "show all namespaces" toggle (ADR-028). Admin-gated UX
      affordance only; NOT the security boundary (the infra unscoping of admin
      reads is authoritative). `*ngIf="(isAdmin$ | async)"` so non-admins (incl.
      anonymous, no roles) never see it — hidden, not merely disabled. Default
      off (firehose is opt-in). Flips `showAllNamespaces` via `onToggleShowAll`,
      which re-runs the single `loadNamespaces()` path so `?all=true` flows
      through it.
    -->
    <span
      *ngIf="(isAdmin$ | async)"
      class="show-all-namespaces"
    >
      <p-toggleswitch
        [ngModel]="showAllNamespaces"
        (ngModelChange)="onToggleShowAll($event)"
        data-test="show-all-namespaces-toggle"
        inputId="show-all-namespaces-toggle"
      ></p-toggleswitch>
      <label for="show-all-namespaces-toggle">{{ "home.showAllNamespaces" | translate }}</label>
    </span>
    <!--
      No Create button. Creating a team is a two-step wizard opened from the
      rail — pick the team type, then answer its metadata contract — so this
      toolbar's team-type select is now only what it always also was: the input
      the filter row, the row title column and the Configuration dialog derive
      from.
    -->
    <!--
      THE THREE CONTROL BUTTONS ARE NATIVE `<button>`s, not `pButton`.

      Their look is `.home-control` in this component's stylesheet, built from
      the same tokens as the rail's `app-icon-button` — so the toolbar and the
      list beside it are one design language rather than Aura's cool-grey
      `severity="secondary"` sitting under a warm redesign. Restyling pButton
      instead would mean overriding Aura's own ramp through `::ng-deep` on
      every state, which is more CSS for a worse result and leaves the
      `severity` vocabulary in the markup implying a palette that no longer
      exists.

      Nothing is lost by dropping the directive: these carry a label, an icon,
      a disabled state and a click, and a native button does all four — and
      does the last two BETTER, since `[disabled]` lands on the element the
      specs query rather than being propagated onto an inner one.

      `extra-small-button` is gone with it. It was defined nowhere in `src/`:
      dead markup that read like a style hook.
    -->
    <!-- Edit Configuration; opens the Monaco panel in a dialog. -->
    <button
      type="button"
      class="home-control"
      [disabled]="!(selectedNamespace$ | async)"
      (click)="namespacePanelVisible = true"
      data-test="edit-namespace-yaml-btn"
    >
      <i class="pi pi-pencil home-control__icon" aria-hidden="true"></i>
      <span>{{ "home.configuration" | translate }}</span>
    </button>
    <button
      type="button"
      class="home-control"
      [disabled]="isRefreshing"
      (click)="refreshContext()"
      data-test="refresh-teams-btn"
    >
      <i
        class="pi home-control__icon"
        [ngClass]="isRefreshing ? 'pi-spinner pi-spin' : 'pi-refresh'"
        aria-hidden="true"
      ></i>
      <span>{{ "common.refresh" | translate }}</span>
    </button>
    <!--
      Show/hide the filter row. Presentation only — it never clears the filter,
      so a HIDDEN row can still be narrowing the list. `hasActiveFilter` is what
      stops that being a lie: while the row is hidden AND filtering, the control
      takes the attention tone and says so in its title, because otherwise the
      table is filtered with its cause off screen and nothing on the page
      explains it.
    -->
    <!--
      `severity="warn"` became `.home-control--attention`, and the token behind
      it is `--akg-attention-fg/-bg` rather than Aura's amber. The MEANING is
      unchanged and is the reason this state cannot simply become grey with the
      rest: it says a filter is narrowing the list from off screen. The tone is
      dark enough to carry the caption (4.5:1 on every ground the palette
      declares) where the signal amber it replaces measured 2.57:1 on white.
    -->
    <button
      type="button"
      class="home-control"
      [class.home-control--attention]="!filtersVisible && hasActiveFilter"
      [attr.aria-expanded]="filtersVisible"
      aria-controls="home-filter-row"
      [attr.title]="
        (!filtersVisible && hasActiveFilter
          ? 'home.filtersActiveTitle'
          : (filtersVisible ? 'home.hideFiltersTitle' : 'home.showFiltersTitle')
        ) | translate
      "
      (click)="toggleFilters()"
      data-test="toggle-filters-btn"
    >
      <i
        class="pi home-control__icon"
        [ngClass]="filtersVisible ? 'pi-filter-slash' : 'pi-filter'"
        aria-hidden="true"
      ></i>
      <span>{{
        (filtersVisible ? "home.hideFilters" : "home.filters") | translate
      }}</span>
    </button>
    </div>

    <!--
      The filter form. Everything it owns — which fields are offered, what is
      typed into them, the narrowing toggle, Reset — lives inside it; this page
      supplies the team type and receives the composed filter back.
    -->
    <app-team-filter
      [namespace]="(selectedNamespace$ | async) ?? null"
      [value]="restoredFilter"
      [visible]="filtersVisible"
      (changed)="onFilterChanged($event)"
    />

    <!--
      Table area — the single flex/scroll region (Story 28.3). Grows to fill the
      bounded .main-container so the [scrollable] table's body scrolls within it
      and the bottom paginator pins; the controls above stay in normal flow.
    -->
    <div class="home-table">
    <!--
      The teams table. Everything a ROW is — its six columns, its action
      controls, their in-flight spinners and the inline description editor —
      lives inside it. This page supplies the page of teams and the paging
      state, and receives back what the user did to a row; the service calls
      that answer those requests stay here.
    -->
    <app-team-table
      [loading]="(contextService.loading$ | async) ?? false"
      [teams]="(contextService.teams$ | async) || []"
      [totalRecords]="contextService.totalCount"
      [rows]="rows"
      [first]="first"
      [titleKey]="(titleKey$ | async) ?? null"
      (lazyLoad)="loadPage($event)"
      (rowSelected)="onRowSelect($event)"
      (stopRequested)="onStopRequested($event)"
      (restoreRequested)="onRestoreRequested($event)"
      (deleteRequested)="deleteTeam($event)"
      (descriptionSaved)="onDescriptionSaved($event)"
    />
    </div>
  </div>
</section>

<!--
  Namespace Panel dialog wrapper.

  `@defer (when namespacePanelVisible)` fetches the NamespacePanelComponent
  (and its Monaco-editor chunk) only on first open. The initial home-page
  bundle stays Monaco-free.

  [(visible)] is split into [visible] + (visibleChange) so the dirty-close
  guard can intercept dismissals; the dirty-close prompt is rendered by the
  panel's own confirm modal via `panel.confirmDiscard()` (ADR-018).

  The header is a <ng-template pTemplate="header"> block so it can render the
  namespace name AND the conditional dirty indicator in the same header.

  [closable] / [dismissableMask] lock the X / dismissable-mask dismissal
  channels during an in-flight write (saving OR cloning). Reads (validate /
  load) stay dismissable — `isWriteInFlight` intentionally excludes
  `validating` / `loading`.

  `[closeOnEscape]="false"` on ALL THREE dialogs (this config host + the
  panel's Clone + confirm modals). PrimeNG attaches `closeOnEscape` as a
  DOCUMENT-level listener per dialog, so a secondary modal's stopPropagation
  cannot stop this host's listener. Instead the host owns ONE coordinated
  Escape handler (`onConfigDialogEscape`, a `document:keydown.escape`
  HostListener) that closes only the topmost secondary modal, or — when none
  is open — runs the config panel close flow.
-->
<p-dialog
  [visible]="namespacePanelVisible"
  (visibleChange)="onNamespacePanelVisibleChange($event)"
  [modal]="true"
  [style]="{ width: '90vw', height: '90vh' }"
  [closable]="!isWriteInFlight"
  [closeOnEscape]="false"
  [dismissableMask]="!isWriteInFlight"
>
  <ng-template pTemplate="header">
    <span class="p-dialog-title">
      {{ namespaceLabel }}
      <span
        *ngIf="namespacePanel?.hasUnsavedChanges() === true"
        class="namespace-panel__dirty-indicator"
        [attr.aria-label]="'home.unsavedChanges' | translate"
        data-test="dirty-indicator-dialog"
      >●</span>
    </span>
  </ng-template>
  @defer (when namespacePanelVisible) {
    <app-namespace-panel
      [namespace]="((selectedNamespace$ | async)?.namespace) ?? ''"
      [existingNamespaces]="namespaceIdentifiers"
      [showAll]="showAllNamespaces"
      (closed)="namespacePanelVisible = false"
      (saved)="onNamespaceSaved()"
    />
  }
</p-dialog>

<!--
  Team-metadata dialog. Opened by the creation gate — which, on THIS page, only
  the gesture-less hideHome route still reaches: the Create button moved to the
  rail's wizard, which provides a gate of its own. The dialog stays here because
  that auto-create route can still need to ask, and a mandatory field skipped on
  the one path nobody is watching is skipped in silence.

  The GATE owns visibility, the captured namespace and the error state, so all
  five bindings below are one-way in off `creation` and the two outputs carry
  the decision straight back to it. This page renders the element and owns none
  of it.

  `(confirmed)` binds a promise-returning method to a `void` output. That is
  fine in a template and its result is ignored; wrapping it or adding a
  page-side forwarder would put a creation member straight back on the page.

  NOT deferred: this component is small and pulls in no heavy chunk. The
  @defer block above exists for the namespace panel's Monaco dependency.

  No extra Escape wiring either — `onConfigDialogEscape` is inactive unless the
  namespace panel is open, so PrimeNG's own `closeOnEscape` handles this dialog
  and the resulting `(visibleChange)` routes to cancel like every other
  dismissal channel.
-->
<app-team-metadata-modal
  [visible]="creation.modalVisible"
  [contract]="creation.contract"
  [namespaceLabel]="creation.namespaceLabel"
  [errorMessage]="creation.errorMessage"
  [pending]="creation.submitting"
  (confirmed)="creation.confirm($event)"
  (cancelled)="creation.cancel()"
/>
