<!--
  Team-metadata dialog.

  Same `p-dialog` shape as the namespace panel on the home page: `[visible]`
  split from `(visibleChange)` so the HOST owns visibility, `[modal]="true"`,
  and a `<ng-template pTemplate="header">` block so the header can name the
  namespace.

  `closeOnEscape` is left at its PrimeNG default deliberately. The home page
  already has ONE document-level Escape handler (`onConfigDialogEscape`), but
  it returns immediately unless the namespace panel is open, so it cannot
  interfere here — PrimeNG's own listener closes this dialog and the resulting
  `(visibleChange)` routes to cancel like every other dismissal channel.

  `[closable]` / `[dismissableMask]` lock the dismissal channels while a
  confirmed create is in flight, matching the namespace panel's
  write-in-flight treatment.
-->
<p-dialog
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '32rem' }"
  [closable]="!pending"
  [dismissableMask]="!pending"
  [focusOnShow]="false"
  data-test="metadata-dialog"
>
  <ng-template pTemplate="header">
    <span class="p-dialog-title" data-test="metadata-dialog-header">
      {{ namespaceLabel }}
    </span>
  </ng-template>

  <!-- Cmd+Enter / Ctrl+Enter submit. Bound on the form container so the
       chord works from any input (keydown bubbles); plain Enter is left
       alone — there is no native form element here, and Enter submitting a
       multi-field dialog mid-fill is a misfire, not a convenience.

       `*ngIf="visible"` recreates the content on every open. Focus owns the
       reason: the dialog keeps its children alive across a close, so a
       once-fired `pAutoFocus` would never fire again — and the dialog's own
       `focusOnShow` is OFF above because it focuses the first focusable in
       the HEADER (the X close button), stealing focus from the field and
       real-blurring it, which marks a fresh control touched. Recreating the
       content gives every open a fresh directive and a fresh focus. -->
  <div
    *ngIf="visible"
    class="team-metadata-modal__body"
    [formGroup]="form"
    (keydown.meta.enter)="onSubmitShortcut($event)"
    (keydown.control.enter)="onSubmitShortcut($event)"
  >
    <div
      *ngFor="let field of fields; let isFirst = first"
      class="team-metadata-modal__row"
    >
      <label
        [attr.for]="'metadata-input-' + field.key"
        class="team-metadata-modal__label"
        [attr.data-test]="'metadata-label-' + field.key"
      >
        {{ labelFor(field) }}
        <!-- Required marker. Rendered for `mandatory` fields only; the gate
             itself lives in `canConfirm`. -->
        <span
          *ngIf="field.mandatory"
          class="team-metadata-modal__required"
          aria-hidden="true"
          [attr.data-test]="'metadata-required-' + field.key"
        >*</span>
      </label>

      <!-- Free-text, always. The descriptor carries no type; nothing here
           infers a control from the key name (AC15).

           `formControlName` is the whole wiring: the control tracks the
           value on every input event, validates on every change (Angular's
           own validators run per keystroke by default), and records
           `touched` on blur — the state this template used to feed a hand
           handler pair. `pending` disables through the form, not an
           attribute binding, which is why no `[disabled]` appears here. -->
      <!-- The FIRST field takes focus on open. The dialog's own
           `focusOnShow` cannot do this: it calls `focus()` with no parent,
           which falls through to the header and lands on the X close button
           — a user who opened the dialog to type would start by closing it.
           `pAutoFocus` re-instantiates with the dialog's content on every
           open, so a reopened dialog focuses again. -->
      <input
        type="text"
        pInputText
        [id]="'metadata-input-' + field.key"
        [formControlName]="field.key"
        [required]="field.mandatory"
        [pAutoFocus]="isFirst"
        [attr.aria-describedby]="describedByFor(field)"
        autocomplete="off"
        [attr.data-test]="'metadata-field-' + field.key"
      />

      <!-- Quiet "filterable" affordance for an indexed field. Informational
           only — `index` gates nothing.

           The input's `aria-describedby` is built by `describedByFor`, which
           names only the hints that are actually in the document: this one is
           absent for a non-indexed field, and an attribute naming an absent
           element is a dangling reference — assistive tech announces nothing
           and the markup lies. It is a space-separated LIST because an indexed
           field carrying a pattern failure is described by two elements. The
           ids derive from the key, which the server guarantees is a unique
           identifier, so two fields can never collide. -->
      <small
        *ngIf="field.index"
        [id]="'metadata-index-' + field.key"
        class="team-metadata-modal__index"
        [attr.data-test]="'metadata-index-' + field.key"
      >filterable</small>

      <!-- The client-side pattern complaint — shown on `invalid && touched`,
           the framework's own display idiom: silent until the field is first
           left, live on every keystroke after. Reuses the same error
           affordance as the server's message rather than inventing a second
           style; it carries no `role` because it appears where the user's
           focus has just left, not unprompted. -->
      <small
        *ngIf="showsPatternError(field)"
        [id]="'metadata-pattern-error-' + field.key"
        class="team-metadata-modal__error"
        [attr.data-test]="'metadata-pattern-error-' + field.key"
      >{{ patternMessageFor(field) }}</small>
    </div>

    <!-- The server's rejection message. Kept inside the dialog with the input
         intact so the named field can actually be corrected. role="alert"
         implies aria-live="assertive" so it is announced on appearance. -->
    <div
      *ngIf="errorMessage !== null"
      class="team-metadata-modal__error"
      role="alert"
      data-test="metadata-error"
    >{{ errorMessage }}</div>
  </div>

  <div class="team-metadata-modal__actions">
    <!-- The reason confirmation is blocked, next to the disabled control: a
         disabled button fires no mouse events, so a tooltip on it would be
         unreachable.

         Both conditions read `missingMandatoryLabels.length > 0` rather than
         `!canConfirm`. A recorded pattern failure also blocks confirmation, so
         the two stopped being synonyms — on `!canConfirm` this hint would
         render as `Required: ` with nothing after it whenever a pattern is the
         only problem, and the Create button would point at it. The button's
         own `[disabled]` stays on `!canConfirm`: that one is still exactly
         right.

         The Create button's `aria-describedby` is bound on the same condition
         as the hint for the same reason as the index hint: the hint is out of
         the document once the mandatory fields are filled, and a reference to
         an absent element is worse than no reference at all. A singleton hint
         listing every missing label, so the id stays literal. -->
    <small
      *ngIf="missingMandatoryLabels.length > 0"
      id="metadata-blocked-hint"
      class="team-metadata-modal__blocked-hint"
      data-test="metadata-blocked-hint"
    >Required: {{ missingMandatoryLabels.join(', ') }}</small>
    <button
      pButton
      type="button"
      size="small"
      severity="secondary"
      label="Cancel"
      [disabled]="pending"
      (click)="onCancel()"
      data-test="metadata-cancel"
    ></button>
    <button
      pButton
      type="button"
      size="small"
      label="Create"
      [icon]="pending ? 'pi pi-spinner pi-spin' : 'pi pi-plus'"
      [disabled]="!canConfirm || pending"
      [attr.aria-describedby]="missingMandatoryLabels.length > 0 ? 'metadata-blocked-hint' : null"
      (click)="onConfirm()"
      data-test="metadata-confirm"
    ></button>
  </div>
</p-dialog>
