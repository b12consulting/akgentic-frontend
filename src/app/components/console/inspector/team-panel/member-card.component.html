<!--
  Monogram, name over role, status dot — and a trailing action.

  TWO CONTROLS, NOT ONE CONTROL DOING TWO THINGS. The row already means "show me
  this member in the Member tab" and has meant it since Epic 56. Reading the
  member's conversation is a different destination — a dialog over the whole
  view — and hanging it on the same click would switch the tab behind and then
  cover it, so the user would land somewhere they never asked for as soon as
  they dismissed the dialog. A second affordance says which is which, and keeps
  the first one doing exactly what it did.

  The action button is a SIBLING of the card, not a child of it: a `<button>`
  inside a `<button>` is invalid, and the browsers that tolerate it disagree
  about which one a click reaches.

  It is visible at rest rather than on hover. An affordance that only appears
  once the pointer is already on the row is invisible to precisely the user who
  is looking for it, which is the same failure the pane divider had.

  `[style.--akg-depth]` publishes THE DEPTH, not the offset. The row says how
  many steps in it is and the stylesheet decides how wide a step is
  (`--akg-member-indent`), so the size of the indent has exactly one owner.
  Binding the computed pixels here is what made that token dead: a deployment
  could re-point it and this card would go on multiplying by a TypeScript
  constant. A custom property rather than a class-per-depth ladder because the
  depth is runtime data, and a ladder would restate the cap in the stylesheet
  too.
-->
<div class="member-row">
  <button
    type="button"
    class="member-card"
    [class.supervisor]="member.kind === 'supervisor'"
    [class.worker]="member.kind === 'worker'"
    [style.--akg-depth]="member.depth"
    (click)="onSelect()"
  >
    <!-- Decorative: the name beside it is what a screen reader should read, and
         an initial announced on its own is a letter with no meaning. -->
    <span class="member-avatar" aria-hidden="true">{{ member.initial }}</span>

    <span class="member-body">
      <span class="member-name">{{ member.label }}</span>
      <span class="member-role">{{ member.roleKey | translate }}</span>
    </span>

    <span
      class="member-dot"
      [class.idle]="!member.active"
      [attr.title]="
        (member.active ? 'inspector.memberActive' : 'inspector.memberIdle')
          | translate
      "
    ></span>
  </button>

  <app-icon-button
    class="member-read"
    size="sm"
    [label]="'inspector.readConversation' | translate"
    (pressed)="onRead()"
  >
    <!-- A speech bubble: the reader shows what this member said, so the mark is
         the transcript rather than the member. -->
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.4-.6L3 21l1.8-4.9A8.3 8.3 0 0 1 3.6 11 8.4 8.4 0 0 1 12 3h.5a8.4 8.4 0 0 1 8.5 8z"></path>
    </svg>
  </app-icon-button>
</div>
