<div class="input-container">
  <div *ngIf="selectedAgents.length > 0" class="reply-indicator">
    <span>{{ "chat.input.sendToPrefix" | translate: { agents: selectedAgentsDisplay } }}</span>
    <i class="pi pi-times reply-indicator-close" role="button" [attr.aria-label]="'chat.input.clearSendTo' | translate" (click)="clearSendTo()"></i>
  </div>
  <p-floatlabel variant="in">
    <div class="input-row">
      <textarea
        pTextarea
        rows="4"
        cols="50"
        [autoResize]="true"
        [style]="{ 'max-height': '400px', 'overflow-y': 'auto' }"
        [(ngModel)]="userInput"
        (keydown.enter)="userInputEnterKeySubmit ? sendMessage() : null"
        (keydown.meta.enter)="sendMessage()"
        (keydown.control.enter)="sendMessage()"
        [mentionConfig]="mentionConfig"
        [mentionListTemplate]="mentionItemTemplate"
      ></textarea>
      <label for="on_label">{{ "chat.input.processInput" | translate }}</label>
    </div>
  </p-floatlabel>

  <!--
    ADR-013: shared mention-list item template. `@` items carry only `name`
    (description/args absent → those rows simply do not render); `/` command
    items render `name` prominently plus `description` and an optional args
    hint (e.g. `<role> [name]`).
  -->
  <ng-template #mentionItemTemplate let-item="item">
    <span class="mention-item-name">{{ item.name }}</span>
    <span *ngIf="item.args?.length" class="mention-item-args">
      {{ commandArgsHint(item.args) }}
    </span>
    <span *ngIf="item.description" class="mention-item-desc">{{ item.description }}</span>
  </ng-template>

  <div class="button-group">
    @if (humanAgents.length > 1) {
      <div class="send-as-group">
        <label class="send-as-label">{{ "chat.input.sendAs" | translate }}</label>
        <p-dropdown
          [options]="humanAgentOptions"
          [(ngModel)]="selectedSender"
          optionLabel="label"
          optionValue="value"
          [placeholder]="'chat.input.sendAs' | translate"
          [showClear]="true"
          size="small"
          appendTo="body"
          [panelStyleClass]="'send-as-panel-up'"
        ></p-dropdown>
      </div>
    }
    <label class="send-to-label">{{ "chat.input.sendTo" | translate }}</label>
    <p-multiSelect
      [options]="dropdownAgents"
      [(ngModel)]="selectedAgents"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'chat.input.allSupervisors' | translate"
      [showClear]="true"
      size="small"
      display="chip"
    ></p-multiSelect>
    <!--
      Story 33-1: the gate no longer depends on run state — a stopped team is
      restored on submit. Story 33-3: it gates on empty text and on the submit
      phase, the single value that also picks the label and the spinner, so the
      control cannot read "idle" while a send is still in flight. This covers
      the CLICK only — the keydown handlers above call sendMessage() directly,
      and its own early return is what rejects a re-entrant key press.
    -->
    <p-button
      size="small"
      icon="pi pi-send"
      [label]="(phase === 'restarting' ? restoreLabelKey : 'chat.input.submit') | translate"
      [loading]="busy"
      (click)="sendMessage()"
      [disabled]="!userInput || busy"
    />
  </div>
</div>
