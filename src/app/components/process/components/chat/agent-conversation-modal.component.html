<p-dialog
  [header]="headerText() ?? ('chat.reader.header' | translate)"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  styleClass="agent-reader-dialog"
  [style]="{ width: '68rem', maxWidth: '92vw' }"
  [contentStyle]="{ height: '70vh', padding: '0', overflow: 'hidden' }"
>
  <div class="reader">
    <!-- The team. Always usable, and the only way through the conversation in a
         deployment that hides agent names in the chat itself. -->
    <nav class="agent-list" [attr.aria-label]="'chat.reader.agentList' | translate">
      <button
        *ngFor="let agent of agents(); trackBy: trackByAgentId"
        type="button"
        class="agent-item"
        [class.selected]="isSelected(agent)"
        [attr.aria-current]="isSelected(agent) ? 'true' : null"
        [attr.data-agent-id]="agent.name"
        (click)="onAgentClick(agent)"
      >
        <span class="agent-name">{{ agentLabel(agent) }}</span>
        <span class="agent-role">{{ agent.role }}</span>
      </button>
      <div *ngIf="agents().length === 0" class="empty-state">
        {{ "chat.reader.noAgents" | translate }}
      </div>
    </nav>

    <!-- The dialogue, and the box that writes to it. -->
    <div class="conversation-pane">
      <!-- Rendered by the SAME message + activity components as the main
           conversation, over the SAME merged display list — see the class
           docstring. -->
      <div class="conversation-column">
        <ng-container *ngIf="displayItems().length > 0; else noTurns">
          <ng-container
            *ngFor="let item of displayItems(); trackBy: trackByDisplayItem"
          >
            <!-- `notification` is a FACT about the request (is a human still
                 owed an answer?), so it is bound here exactly as the main
                 transcript binds it. Left unbound it defaulted to false and the
                 request fold printed "Answered" over a request nobody had
                 answered yet. `replyEnabled` is the separate question — this
                 surface does not host the human-input modal, so it reports the
                 state and offers no button. -->
            <app-chat-message
              *ngIf="item.kind === 'message'"
              [attr.data-message-id]="item.data.id"
              [message]="item.data"
              [ratingEnabled]="false"
              [replyEnabled]="false"
              [notification]="isPending(item.data)"
              (messageSelected)="onMessageAgentClick($event)"
              (toggleCollapse)="onToggleCollapse($event)"
            ></app-chat-message>
            <!-- Chrome, not a turn (Epic 54 NFR1). It falls out of the shared
                 merge rather than being re-derived here. -->
            <div *ngIf="item.kind === 'day'" class="day-separator" role="separator">
              <span class="day-separator-label">{{ item.data.label }}</span>
            </div>
            <app-chat-thinking
              *ngIf="item.kind === 'thinking'"
              [state]="item.data"
              [expanded]="isRunExpanded(item.data)"
              (toggleExpanded)="onToggleRunExpanded($event)"
            ></app-chat-thinking>
          </ng-container>
        </ng-container>
        <ng-template #noTurns>
          <div class="empty-state">
            <ng-container *ngIf="selectedAgent(); else noAgent">
              <!-- A team lists agents that have not spoken. Saying so is the
                   difference between an empty conversation and a broken one. -->
              {{
                "chat.reader.noTurns"
                  | translate: { agent: agentLabel(selectedAgent()!) }
              }}
            </ng-container>
            <ng-template #noAgent>
              {{ "chat.reader.selectAgent" | translate }}
            </ng-template>
          </div>
        </ng-template>
      </div>

      <!-- W5b: message the OPEN agent directly. Outside `.conversation-column`
           on purpose — the transcript stays a transcript, and the one write
           affordance in this dialog is in one identifiable place. Present only
           when there is somebody to address. -->
      <div *ngIf="selectedAgent() as agent" class="reader-composer">
        <textarea
          class="reader-composer-input"
          rows="2"
          [value]="draft()"
          [disabled]="!composerEnabled()"
          [attr.aria-label]="
            'chat.reader.composer.placeholder'
              | translate: { agent: agentLabel(agent) }
          "
          [attr.placeholder]="
            'chat.reader.composer.placeholder'
              | translate: { agent: agentLabel(agent) }
          "
          (input)="onDraftInput($event)"
          (keydown)="onComposerKeydown($event)"
        ></textarea>
        <button
          type="button"
          class="reader-composer-send"
          [disabled]="sendDisabled()"
          (click)="onSend()"
        >
          {{ "chat.reader.composer.send" | translate }}
        </button>
        <!-- The disabled control was previously MUTE: a stopped team greyed the
             button out and said nothing about why. The hint is the only copy on
             this surface that explains a state the user did not cause. -->
        <p *ngIf="!composerEnabled()" class="reader-composer-hint">
          {{ "chat.reader.composer.stoppedHint" | translate }}
        </p>
      </div>
    </div>
  </div>
</p-dialog>
