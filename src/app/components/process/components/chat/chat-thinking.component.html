<!--
  The activity fold.

  Between a human's message and the answer, an agent does work: it calls tools
  and it contacts other agents. That work is WHAT HAPPENED, not what was said,
  so it renders as one quiet row rather than as speech — the latest step, live,
  replaced as the next one starts. The caret opens the full sequence.

  The row is the summary, not a header above one: collapsed, there is nothing
  else to show, so a separate header line would be an empty frame.
-->
<div
  class="activity"
  [class.live]="!state().final"
  [class.expanded]="expanded()"
  [class.openable]="stepCount() > 0"
  (click)="onClick()"
>
  <div class="activity-row">
    <!--
      A WRENCH, not a dot. The mark leads the row, and the whole job of a
      leading mark is to say what kind of row this is before anything is read;
      a 6px grey dot says only "something is here", which is the one thing the
      reader can already see. The tool hue (`--akg-tool-accent`) is reserved for
      exactly this — a step ran — so the glyph and its colour say the same thing
      twice, in the two channels a glance uses.

      The pulse survives, moved onto the glyph: it is still one mark with two
      states, slow while the agent works and still once it has answered.
    -->
    <svg
      class="activity-mark"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M14.7 6.3a4 4 0 0 1-5 5L5 16v3h3l4.7-4.7a4 4 0 0 1 5-5l2.6-2.6-2.6-2.6z" />
    </svg>

    <span class="activity-agent">{{ state().agent_name }}</span>

    <span class="activity-latest" *ngIf="latest() as l">{{
      latestKey() | translate: { tool: l.tool_name }
    }}</span>

    <span class="activity-count" *ngIf="stepCount() > 1">{{
      "chat.activity.steps" | translate: { count: stepCount() }
    }}</span>

    <span class="activity-spacer"></span>

    <!--
      The start time, BEFORE the toggle rather than after it.

      The mock draws no clock here at all, and the toggle label owns the
      trailing edge. The clock is kept because every other row in the transcript
      carries one — the collapsed agent-to-agent line, the compaction marker,
      the agent's own turn — and a fold that sits between two timestamped rows
      without one reads as an item with no place in the sequence. What it does
      NOT do is take the trailing slot: that is the toggle's, because the
      trailing edge is where the eye goes for "and then what".
    -->
    <span class="activity-time">{{ state().start_time | date: "HH:mm" }}</span>

    <!--
      A LABEL, not a chevron.

      The transcript's other two folds (the rule-6 marker, the collapsed
      rule-3/4 row) keep their carets, and this one departs on purpose: those
      are rows whose text is already the thing you would read, so a caret only
      has to say "there is more of this". This fold's text is a SUMMARY, and
      what opening it gives you — the steps the agent took — is not deducible
      from it. The label says it in two words, which a chevron cannot.

      A real `<button>`: the fold's own row is clickable, but a click target
      with no focusable element in it is unreachable from a keyboard, and this
      is the affordance a reader is looking at when they decide to open it.
    -->
    <button
      *ngIf="stepCount() > 0"
      type="button"
      class="activity-toggle"
      [attr.aria-expanded]="expanded()"
      (click)="onToggleFromLabel($event)"
    >
      {{
        (expanded() ? "chat.activity.collapse" : "chat.activity.expand")
          | translate
      }}
    </button>
  </div>

  <!--
    Opened: each step is a short sentence and a supporting line. The call as it
    came off the wire is one click further in — kept, because an operator
    debugging a run needs it, and hidden, because nobody reading the
    conversation does.
  -->
  <ol class="activity-list" *ngIf="expanded() && stepCount() > 0">
    <li
      class="activity-entry"
      *ngFor="let n of narratedSteps(); trackBy: trackByStepId"
      [class.done]="n.step.done"
    >
      <span class="entry-bullet" aria-hidden="true"></span>
      <div class="entry-body">
        <div class="entry-title">
          {{
            n.titleKey
              ? (n.titleKey | translate: { tool: n.title })
              : n.title
          }}
        </div>
        <div class="entry-detail" *ngIf="n.detail">{{ n.detail }}</div>
      </div>
    </li>

    <li class="activity-raw-row">
      <button
        type="button"
        class="activity-raw-toggle"
        (click)="onToggleRaw($event)"
      >
        {{ (rawOpen() ? "chat.activity.hideRaw" : "chat.activity.showRaw") | translate }}
      </button>
      <div class="activity-raw" *ngIf="rawOpen()">
        <div
          class="raw-line"
          *ngFor="let n of narratedSteps(); trackBy: trackByStepId"
        >
          {{ n.raw }}
        </div>
      </div>
    </li>
  </ol>
</div>
