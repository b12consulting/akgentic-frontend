<ng-container *ngIf="agentsByCategory; else noAgentsPlaceholder">
  <p-tabs value="0">
    <p-tablist>
      <p-tab value="0" *ngIf="chatTabVisible$ | async">
        {{ "panels.chatWith" | translate: { agent: selectedAgent?.label } }}
      </p-tab>
      <div
        style="
          margin-left: auto;
          margin-right: 0.75rem;
          display: flex;
          align-items: center;
          gap: 1rem;
        "
      >
        <p-dropdown
          optionLabel="label"
          group="true"
          [placeholder]="'panels.selectAgent' | translate"
          appendTo="body"
          inputId="agent-dropdown"
          [options]="agentsByCategory"
          [filter]="true"
          [style]="{ minWidth: '220px', 'max-width': '300px' }"
          [disabled]="agentsByCategory.length === 0"
          [(ngModel)]="selectedAgent"
          (onChange)="onAgentSelect($event)"
        ></p-dropdown>
      </div>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="0" *ngIf="chatTabVisible$ | async">
        <app-akgent-chat
          [context$]="context$"
          [backstory$]="backstory$"
          [agentId]="akgentId"
          [agentName]="akgentName"
        ></app-akgent-chat>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</ng-container>
<ng-template #noAgentsPlaceholder>
  <div class="empty-section agent-placeholder">
    <div class="empty-section-box">
      <i class="pi pi-users agent-placeholder-icon"></i>
      <div class="agent-placeholder-title">{{ "panels.noAgentsTitle" | translate }}</div>
      <div class="agent-placeholder-desc">
        {{ "panels.noAgentsDesc" | translate }}
      </div>
    </div>
  </div>
</ng-template>
