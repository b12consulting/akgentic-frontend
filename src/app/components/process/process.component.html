<section>
  <div class="main-container">
    <div class="left-column">
      <app-chat-panel
        class="chat-app"
        [processId]="processId"
      ></app-chat-panel>
    </div>

    <div
      class="right-column"
      [class.animated]="animateRightColumn"
      [class.collapsed]="isRightColumnCollapsed$ | async"
    >
      <div class="right-header">
        <p-selectbutton
          [options]="(visualizationOptions$ | async) ?? []"
          optionLabel="labelKey"
          optionValue="value"
          aria-labelledby="basic"
          [ngModel]="currentVisualizationMode"
          (onChange)="setVisualizationMode($event.value)"
          style="background-color: #ffffff"
          ><ng-template #item let-item>
            <i [class]="item.icon"></i>
            <span>{{ item.labelKey | translate }}</span>
          </ng-template></p-selectbutton
        >
      </div>
      <div class="visualization-container">
        <div [class.moved-offscreen]="isHidden('team')">
          <app-team-tabs></app-team-tabs>
        </div>
        <div [class.moved-offscreen]="isHidden('member')">
          <app-agent-tabs></app-agent-tabs>
        </div>
        <app-workspace-tabs
          *ngIf="hasWorkspace$ | async"
          [class.moved-offscreen]="isHidden('workspace')"
        ></app-workspace-tabs>
        <!--
          Story 52-1: `[processId]` is BOUND rather than left to the child's
          `route.snapshot.params['id']` fallback. Hosted on the teams list
          there is no `:id` in the URL at all, so the fallback resolves to
          `undefined` and the graph would ask the API about a team of that name.
        -->
        <app-knowledge-graph
          *ngIf="hasKnowledgeGraph$ | async"
          [processId]="processId"
          [class.moved-offscreen]="isHidden('knowledge-graph')"
        ></app-knowledge-graph>
        <app-message-list
          [class.moved-offscreen]="isHidden('messages')"
        ></app-message-list>
      </div>
    </div>
  </div>
</section>
